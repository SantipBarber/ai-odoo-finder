[project]
name = "ai-odoofinder-mcp"
version = "1.0.0"
description = "MCP Server for AI-OdooFinder - Semantic search for Odoo modules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ai-odoofinder-mcp = "ai_odoofinder_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_odoofinder_mcp"]
