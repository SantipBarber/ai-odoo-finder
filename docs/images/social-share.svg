<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>

    <pattern id="socialDots" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="2" fill="#FFFFFF" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#socialGrad)"/>
  <rect width="1200" height="630" fill="url(#socialDots)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="100" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="1050" cy="480" r="120" fill="#FFFFFF" opacity="0.05"/>

  <!-- Main content box -->
  <rect x="100" y="165" width="1000" height="300" rx="20" fill="#FFFFFF" opacity="0.1"/>

  <!-- Robot icon (left) -->
  <g transform="translate(160, 220)">
    <rect x="0" y="15" width="60" height="50" rx="8" fill="#ffffff"/>
    <line x1="30" y1="15" x2="30" y2="5" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="30" cy="0" r="5" fill="#10b981"/>
    <circle cx="18" cy="35" r="7" fill="#6366f1"/>
    <circle cx="42" cy="35" r="7" fill="#6366f1"/>
    <rect x="15" y="52" width="30" height="5" rx="2.5" fill="#6366f1"/>
  </g>

  <!-- Magnifying glass icon (right) -->
  <g transform="translate(980, 230)">
    <circle cx="20" cy="20" r="25" fill="none" stroke="#ffffff" stroke-width="6"/>
    <line x1="38" y1="38" x2="55" y2="55" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    AI-OdooFinder
  </text>

  <!-- Subtitle -->
  <text x="600" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#E5E7EB" text-anchor="middle">
    Find the Perfect Odoo Module with AI
  </text>

  <!-- Bottom tagline -->
  <text x="600" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#D1D5DB" text-anchor="middle" font-style="italic">
    16,000+ OCA Modules | Hybrid Search | MCP Server
  </text>

  <!-- GitHub URL -->
  <text x="600" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle" opacity="0.8">
    github.com/SantipBarber/ai-odoo-finder
  </text>
</svg>
